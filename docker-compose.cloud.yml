name: ten-days-gambit

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ten_days_gambit}
      MYSQL_USER: ${MYSQL_USER:-tdg}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tdg-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tdg-root-password}
    volumes:
      - tdg_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_APP_ID: ${APP_ID:-tdg-cloud}
        VITE_KIMI_AUTH_URL: ${KIMI_AUTH_URL:-https://auth.kimi.com}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${TDG_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      NODE_ENV: production
      PORT: 8080
      APP_ID: ${APP_ID:-tdg-local}
      APP_SECRET: ${APP_SECRET:-replace-this-before-sharing}
      DATABASE_URL: ${DATABASE_URL:-mysql://tdg:tdg-local-password@mysql:3306/ten_days_gambit}
      KIMI_AUTH_URL: ${KIMI_AUTH_URL:-https://auth.kimi.com}
      KIMI_OPEN_URL: ${KIMI_OPEN_URL:-https://open.kimi.com}
      OWNER_UNION_ID: ${OWNER_UNION_ID:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TDG_NARRATIVE_API_URL: ${TDG_NARRATIVE_API_URL:-}
      TDG_NARRATIVE_API_KEY: ${TDG_NARRATIVE_API_KEY:-}
      TDG_NARRATIVE_MODEL: ${TDG_NARRATIVE_MODEL:-deepseek-chat}
      AGENT_REGISTRATION_ENABLED: ${AGENT_REGISTRATION_ENABLED:-true}
      AGENT_REGISTRATION_CODE: ${AGENT_REGISTRATION_CODE:-tdg-demo-2026}

  # 可选的常驻外部 Agent。默认 profile 不启动；需要让云主机自己的影从持续探索时，
  # 先填写 deploy/agent-worker.env，再使用 --profile agent-worker 启动。
  agent-worker:
    build:
      context: .
      dockerfile: cli/Dockerfile
    restart: unless-stopped
    profiles: ["agent-worker"]
    depends_on:
      app:
        condition: service_started
    environment:
      TDG_BASE_URL: http://app:8080
      TDG_AGENT_CONFIG: /data/agent.json
      TDG_AGENT_NAME: ${TDG_AGENT_NAME:-终焉常驻影从}
      TDG_INVITE_CODE: ${AGENT_REGISTRATION_CODE:-tdg-demo-2026}
      TDG_INTERVAL_MS: ${TDG_INTERVAL_MS:-5000}
      TDG_REPORT_CHANNEL: ${TDG_REPORT_CHANNEL:-feishu}
      TDG_REPORT_WEBHOOK_URL: ${TDG_REPORT_WEBHOOK_URL:-}
    volumes:
      - tdg_agent_data:/data

  # 腾讯云首发可选边缘层：默认 profile 不启动，启用 edge 后由 Caddy
  # 负责 80/443 与自动证书，应用仍只在 Compose 网络内监听 8080。
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles: ["edge"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TDG_DOMAIN: ${TDG_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tdg_caddy_data:/data
      - tdg_caddy_config:/config

volumes:
  tdg_mysql_data:
  tdg_agent_data:
  tdg_caddy_data:
  tdg_caddy_config:
